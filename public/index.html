<style>

.auth{height:100%;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 50% 25%,rgba(124,58,237,.18),transparent 55%)}.auth-box{width:min(410px,100%);padding:38px;border-radius:28px;box-shadow:0 30px 100px #0008,0 0 55px #8b5cf626}.brand-mark{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;margin:0 auto 18px;background:linear-gradient(135deg,#a78bfa,#22d3ee);color:#090b18;box-shadow:0 8px 32px #a78bfa38}.brand-mark svg{width:24px;height:24px;stroke-width:2.2}.auth-logo{text-align:center;font:800 30px/1.2 Manrope,sans-serif;letter-spacing:-1.5px;background:linear-gradient(100deg,#c4b5fd,#67e8f9 75%);color:transparent;background-clip:text}.auth-sub{text-align:center;color:var(--muted);margin:10px 0 28px}.field{width:100%;height:48px;padding:0 15px;border:1px solid #a78bfa25;border-radius:13px;background:#080b18a8;color:var(--text);outline:none;transition:border .2s,box-shadow .2s;margin-bottom:12px}.field:focus{border-color:#a78bfa99;box-shadow:0 0 0 4px #a78bfa12,0 0 25px #a78bfa12}.primary{border:0;border-radius:13px;background:linear-gradient(110deg,#8b5cf6,#5b9cf6 55%,#22d3ee);color:white;font-weight:700;cursor:pointer;transition:transform .2s,filter .2s,box-shadow .2s}.auth .primary{width:100%;height:48px;margin-top:5px}.primary:hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 10px 30px #8b5cf63a}.primary:active,.icon-btn:active,.logout-btn:active{animation:pressBounce .28s ease}.auth-switch{text-align:center;color:var(--muted);margin-top:20px;font-size:13px}.auth-switch button{background:none;border:0;color:var(--cyan);font-weight:700;cursor:pointer;margin-left:4px}.auth-error{color:var(--danger);font-size:12px;text-align:center;min-height:18px;margin-bottom:5px}

:sparkFly .55s ease-out forwards}.feed-view{display:none;flex:1;min-height:0;overflow:auto;padding:20px clamp(12px,3vw,36px);flex-direction:column;gap:14px}.feed-view.active{display:flex;animation:messageIn .25s ease-out}.feed-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.feed-top h2{font:800 22px Manrope,sans-serif;margin:0;flex:1}.feed-add{display:flex;gap:8px;width:100%}.feed-add input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;background:#090c1a9c;color:var(--text);padding:12px 14px;outline:none}.feed-add button,.feed-filter,.video-actions button,.modal-actions button{border:1px solid #a78bfa35;background:#a78bfa12;color:#e8e5ff;border-radius:11px;padding:10px 13px;cursor:pointer;transition:.2s}.feed-add button:hover,.video-actions button:hover,.feed-filter.active{background:#a78bfa2d;border-color:#a78bfa80}.feed-filters{display:flex;gap:7px;flex-wrap:wrap}.video-card{width:min(100%,760px);align-self:center;border:1px solid #a78bfa27;border-radius:20px;background:linear-gradient(145deg,#171a30d9,#0c1022df);overflow:hidden;box-shadow:0 14px 40px #0003;animation:messageIn .3s ease-out}.video-card-head{display:flex;align-items:center;gap:10px;padding:13px 15px}.video-card-head strong{font-size:13px}.video-card-head small{display:block;color:var(--muted);font-size:11px}.video-card-head .spacer{flex:1}.video-delete{border:0;background:transparent;color:#fda4af;cursor:pointer;font-size:18px}.video-frame{width:100%;aspect-ratio:16/9;background:#050711;border:0;display:block}.video-frame.vertical{aspect-ratio:9/16;max-height:70vh;width:min(100%,420px);margin:auto}.video-actions{display:flex;gap:7px;flex-wrap:wrap;padding:12px 14px}.video-actions button{padding:8px 11px;font-size:12px}.video-actions button.liked{color:#fda4af;background:#fb71851c}.video-comments{padding:0 15px 14px;color:var(--muted);font-size:12px}.video-empty{padding:35px 15px;text-align:center;color:var(--muted);border:1px dashed #a78bfa35;border-radius:16px}.vid <body>
<div id="app">
  <section class="auth" id="authScreen">
    <div class="auth-box glass">
      <div class="brand-mark"><svg viewBox="0 0 24 24"><path d="M5 5.5h14v10H11l-4.5 3v-3H5z"/><path d="m9 9 3 3 3-3"/></svg></div>
      <div class="auth-logo">YutuGram</div>
      <div class="auth-sub" id="authSub">Твоё пространство для общения</div>
      <input class="field" id="authLogin" placeholder="Логин" autocomplete="username" maxlength="24">
      <input class="field" id="authName" placeholder="Как тебя называть" style="display:none" maxlength="40">
      <input class="field" id="authPassword" type="password" placeholder="Пароль" autocomplete="current-password">
      <div class="auth-error" id="authError"></div>
      <button class="primary" id="authBtn">Войти в YutuGram</button>
      <div class="auth-switch"><span id="authSwitchText">Впервые здесь?</span><button id="authSwitchBtn">Создать аккаунт</button></div>
    </div>
  </section>
  <main class="main" id="mainScreen">
    <aside class="sidebar glass" id="sidebar">
      <div class="sidebar-header"><div><div class="brand-small">YutuGram</div><div class="my-profile-row"><div class="user-avatar" id="myAvatar" title="Изменить аватарку">YG</div><div class="my-tag" id="myTag" title="Нажми, чтобы изменить аватарку">@—</div></div></div><button class="logout-btn" id="logoutBtn">Выйти</button></div>
      <div class="sidebar-tools"><label class="search-wrap"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg><input id="userSearch" placeholder="Поиск людей..." aria-label="Поиск людей"></label></div>
      <div class="feed-nav"><button id="chatsTab" class="active">💬 Чаты</button><button id="feedTab">🎬 Лента</button></div>
      <div class="section-title" id="communityTitle">Сообщество</div>
      <div class="user-list" id="userList"></div>
    </aside>
    <section class="chat-area glass" id="chatArea">
      <div class="no-chat" id="noChat"><div class="empty-icon"><svg viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-8 7.5 8.7 8.7 0 0 1-3.5-.8L4 20l1.4-3.6A7.1 7.1 0 0 1 4 11.5 7.5 7.5 0 0 1 12 4a7.5 7.5 0 0 1 8 7.5Z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/></svg></div><strong>Тихое место для диалогов</strong><p>Выбери человека слева, чтобы начать общение</p></div>
      <div class="chat-view" id="chatView">
        <header class="chat-header"><button class="icon-btn back-btn" id="backBtn" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><div class="user-avatar" id="chatHeaderAvatar">YG</div><div class="chat-header-info"><h3 id="chatHeaderName">—</h3><p id="chatHeaderStatus">оффлайн</p></div><div class="header-spacer"></div><button class="icon-btn sound-btn" id="soundBtn" aria-label="Выключить звук уведомлений" title="Звук уведомлений: включён">♪</button><div class="header-status"><span class="mini-dot"></span><span id="headerStatusText">Защищённый диалог</span></div></header>
        <div class="messages" id="messages"></div>
        <div class="typing" id="typingIndicator">Собеседник печатает <span class="typing-dots"><i></i><i></i><i></i></span></div>
        <div class="chat-input"><input class="file-input" id="fileInput" type="file"><input class="avatar-file" id="avatarInput" type="file" accept="image/*"><button class="icon-btn" id="attachBtn" aria-label="Прикрепить файл" title="Прикрепить файл"><svg viewBox="0 0 24 24"><path d="m21.4 11.1-8.9 8.9a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg></button><div class="emoji-wrap"><button class="icon-btn" id="emojiBtn" aria-label="Эмодзи" title="Эмодзи">😀</button><div class="emoji-panel" id="emojiPanel" role="dialog" aria-label="Выбор эмодзи"><div class="emoji-tabs"><button class="emoji-tab active" data-category="smiles">😀</button><button class="emoji-tab" data-category="gestures">👋</button><button class="emoji-tab" data-category="hearts">💜</button><button class="emoji-tab" data-category="food">🍕</button></div><div class="emoji-grid" id="emojiGrid"></div></div></div><div class="composer"><input id="msgInput" placeholder="Напиши что-нибудь..." maxlength="5000" autocomplete="off" aria-label="Сообщение"></div><button class="send-btn" id="sendBtn" aria-label="Отправить" title="Отправить"><svg viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button></div>
      </div>
      <section class="feed-view" id="feedView" aria-label="Видео-лента">
        <div class="feed-top"><h2>🎬 Лента</h2><span style="color:var(--muted);font-size:12px">Видео сообщества</span></div>
        <form class="feed-add" id="videoAddForm"><input id="videoUrlInput" type="url" placeholder="Вставь ссылку TikTok, YouTube, Instagram, VK, Rutube или X" required><button type="submit">＋ Добавить</button></form>
        <div class="feed-filters"><button class="feed-filter active" data-platform="all">Все</button><button class="feed-filter" data-platform="TikTok">TikTok</button><button class="feed-filter" data-platform="YouTube">YouTube</button><button class="feed-filter" data-platform="VK">VK</button><button class="feed-filter" id="savedVideosBtn">🔖 Избранное</button></div>
        <div id="videoFeed" style="display:flex;flex-direction:column;gap:14px"><div class="video-empty">Загружаем видео…</div></div>
      </section>
    </section>
  </main>
  <div class="video-modal" id="videoModal" role="dialog" aria-modal="true" aria-label="Комментарии"><div class="video-modal-box"><div class="video-modal-head"><h3>💬 Комментарии</h3><button class="video-modal-close" id="videoModalClose" aria-label="Закрыть">×</button></div><div class="comment-list" id="commentList"></div><form class="comment-form" id="commentForm"><input id="commentInput" maxlength="1000" placeholder="Написать комментарий…" required><button type="submit">Отправить</button></form></div></div>
  <div class="toast" id="toast"></div>
</div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const ICON = {
  file:'<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>',
  edit:'<svg viewBox="0 0 24 24"><path d="m16 4 4 4M4 20l4-.8L19 8a2.8 2.8 0 0 0-4-4L4 15z"/></svg>',
  trash:'<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"/></svg>'
};
let me=null, socket=null, activeUser=null, onlineUsers=[], allUsers=[], typingTimer=null, typingStopTimer=null;
let authMode='login', currentMessages=[];
let soundEnabled=localStorage.getItem('yg_sound')!=='off', unreadCount=0, emojiCategory='smiles', cursorStart=0, cursorEnd=0, audioContext=null;
const authScreen=$('authScreen'), mainScreen=$('mainScreen'), authBtn=$('authBtn');
const authLogin=$('authLogin'), authName=$('authName'), authPassword=$('authPassword'), authError=$('authError');
const msgInput=$('msgInput'), messagesBox=$('messages');

$('authSwitchBtn').addEventListener('click',()=>{
  authMode=authMode==='login'?'register':'login';
  $('authSub').textContent=authMode==='register'?'Создай аккаунт и выбери имя':'Твоё пространство для общения';
  authBtn.textContent=authMode==='register'?'Создать аккаунт':'Войти в YutuGram';
  $('authSwitchText').textContent=authMode==='register'?'Уже есть аккаунт?':'Впервые здесь?';
  $('authSwitchBtn').textContent=authMode==='register'?'Войти':'Создать аккаунт';
  authName.style.display=authMode==='register'?'block':'none';
  authPassword.autocomplete=authMode==='register'?'new-password':'current-password';
  authError.textContent='';
});
authBtn.addEventListener('click',authenticate);
[authLogin,authName,authPassword].forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter')authenticate()}));
async function authenticate(){
  const login=authLogin.value.trim().toLowerCase(), password=authPassword.value;
  if(!login||!password){authError.textContent='Заполни логин и пароль';return}
  authBtn.disabled=true;authBtn.style.opacity='.7';authError.textContent='';
  try{
    const r=await fetch(authMode==='register'?'/api/register':'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login,password,name:authName.value.trim()||login})});
    const data=await r.json();if(!r.ok)throw new Error(data.error||'Не удалось войти');
    me=data.user;localStorage.setItem('yg_me',JSON.stringify(me));enterApp();
  }catch(e){authError.textContent=e.message||'Ошибка соединения'}
  finally{authBtn.disabled=false;authBtn.style.opacity='1'}
}
$('myTag').addEventListener('click',()=>$('avatarInput').click());$('myAvatar').addEventListener('click',()=>$('avatarInput').click());
$('avatarInput').addEventListener('change',uploadAvatar);
$('soundBtn').addEventListener('click',()=>{soundEnabled=!soundEnabled;localStorage.setItem('yg_sound',soundEnabled?'on':'off');updateSoundButton();toast(soundEnabled?'Звук уведомлений включён':'Звук уведомлений выключен')});
updateSoundButton();
$('logoutBtn').addEventListener('click',()=>{localStorage.removeItem('yg_me');if(socket)socket.disconnect();location.reload()});
$('userSearch').addEventListener('input',renderUsers);
$('backBtn').addEventListener('click',()=>{if(window.innerWidth<=760){$('sidebar').classList.remove('compact-hidden');$('chatArea').classList.add('chat-hidden')}});
function enterApp(){
  authScreen.style.display='none';mainScreen.classList.add('active');$('myTag').textContent='@'+me.login;renderMyAvatar();
  socket=io();socket.on('connect',()=>socket.emit('auth',me.login));
  socket.on('online',list=>{onlineUsers=list;renderUsers();updateHeaderStatus()});
  socket.on('message',onIncomingMessage);
  socket.on('message-edited',msg=>{const idx=currentMessages.findIndex(m=>m.id===msg.id);if(idx>=0){currentMessages[idx]=msg;renderMessages(currentMessages)}});
  socket.on('message-deleted',data=>{currentMessages=currentMessages.filter(m=>m.id!==data.id);renderMessages(currentMessages)});
  socket.on('message-read',data=>{const m=currentMessages.find(x=>x.id===data.id);if(m){m.read=true;renderMessages(currentMessages)}});
  socket.on('typing',data=>{if(data.from!==activeUser)return;$('typingIndicator').classList.toggle('active',!!data.active)});
  socket.on('video-added',v=>{videoCache=videoCache.filter(x=>x.id!==v.id);videoCache.unshift(v);if($('feedView').classList.contains('active')&&!savedVideosMode)renderVideoFeed()});
  socket.on('video-liked',d=>{const v=videoCache.find(x=>x.id===d.id);if(v){v.likes=d.likes;if(d.login===me.login)v.liked=d.liked;renderVideoFeed()}});
  socket.on('video-commented',d=>{const v=videoCache.find(x=>x.id===d.id);if(v){v.comments=v.comments||[];v.comments.push(d.comment);if(activeVideoId===d.id)renderComments(v);renderVideoFeed()}});
  socket.on('video-deleted',d=>{videoCache=videoCache.filter(v=>v.id!==d.id);renderVideoFeed()});
  loadUsers();
}
async function loadUsers(){try{const r=await fetch('/api/users');if(!r.ok)throw Error();allUsers=(await r.json()).filter(u=>u.login!==me.login);renderUsers()}catch{toast('Не удалось загрузить список пользователей')}}
function hashString(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function avatarStyle(login){const h=hashString(login);const a=h%360,b=(a+55+(h%70))%360;return `linear-gradient(135deg,hsl(${a} 78% 61%),hsl(${b} 78% 46%))`}
function initials(name){return String(name||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()}
function avatarHTML(user,online=false){return `<div class="user-avatar" style="background:${avatarStyle(user.login)}">${user.avatar?`<img class="avatar-image" src="${escapeHtml(user.avatar)}" alt="">`:escapeHtml(initials(user.name))}${online?'<span class="online-dot"></span>':''}</div>`}
function renderUsers(){
  const list=$('userList'), q=$('userSearch').value.trim().toLowerCase();
  const users=allUsers.filter(u=>(u.name+' '+u.login).toLowerCase().includes(q));
  if(!users.length){list.innerHTML=`<div class="empty-users">${allUsers.length?'Ничего не найдено':'Здесь пока никого нет.<br>Создай второй аккаунт в другом браузере.'}</div>`;return}
  list.innerHTML=users.map(u=>{const online=onlineUsers.includes(u.login);return `<div class="user-item ${activeUser===u.login?'active':''}" data-login="${escapeHtml(u.login)}">${avatarHTML(u,online)}<div class="user-info"><div class="user-name">${escapeHtml(u.name)}</div><div class="user-login ${online?'status-online':''}">@${escapeHtml(u.login)} · ${online?'в сети':'не в сети'}</div></div></div>`}).join('');
  list.querySelectorAll('.user-item').forEach(el=>el.addEventListener('click',()=>openChat(el.dataset.login)));
}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function openChat(login){
  activeUser=login;unreadCount=0;updateDocumentTitle();const user=allUsers.find(u=>u.login===login);if(!user)return;
  $('noChat').style.display='none';$('chatView').style.display='flex';$('chatArea').classList.remove('chat-hidden');$('sidebar').classList.toggle('compact-hidden',window.innerWidth<=760);
  $('chatHeaderName').textContent=user.name;$('chatHeaderAvatar').style.background=avatarStyle(user.login);$('chatHeaderAvatar').innerHTML=user.avatar?`<img class="avatar-image" src="${escapeHtml(user.avatar)}" alt="">`:escapeHtml(initials(user.name));
  updateHeaderStatus();renderUsers();$('typingIndicator').classList.remove('active');
  messagesBox.innerHTML='<div class="empty-users">Загружаем сообщения…</div>';
  try{const r=await fetch(`/api/messages/${encodeURIComponent(me.login)}/${encodeURIComponent(login)}`);if(!r.ok)throw Error();currentMessages=await r.json();renderMessages(currentMessages);socket.emit('read',{from:login})}catch{messagesBox.innerHTML='<div class="empty-users">Не удалось загрузить сообщения</div>'}
  msgInput.focus();
}
function updateHeaderStatus(){if(!activeUser)return;const online=onlineUsers.includes(activeUser);$('chatHeaderStatus').textContent=online?'в сети':'был(а) не в сети';$('chatHeaderStatus').classList.toggle('online',online);$('headerStatusText').textContent=online?'На связи':'Диалог'}
function formatTime(ts){const d=new Date(ts);return d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
function fileCard(file){if(!file||!file.url)return '';return `<a class="file-card" href="${escapeHtml(file.url)}" target="_blank" rel="noopener" download="${escapeHtml(file.name)}">${ICON.file}<span><strong>${escapeHtml(file.name)}</strong><small>${formatSize(file.size)} · открыть файл</small></span></a>`}
function formatSize(n){if(!n)return 'Файл';if(n<1024)return n+' Б';if(n<1048576)return (n/1024).toFixed(1)+' КБ';return (n/1048576).toFixed(1)+' МБ'}
function linkifyEscapedText(text){return escapeHtml(text).replace(/(https?:\/\/[^\s<]+)/g, url=>`<a class="link-url" href="${url}" target="_blank" rel="noopener">${url}</a>`)}
function messageHTML(m){const out=m.from===me.login;return `<div class="msg ${out?'out':'in'}" data-id="${escapeHtml(m.id)}">${m.file?fileCard(m.file):''}${m.text?`<div class="msg-content">${linkifyEscapedText(m.text)}</div>`:''}<div class="msg-meta"><span>${m.edited?'изменено · ':''}${formatTime(m.time)}</span>${out?`<span class="read-check" title="${m.read?'Прочитано':'Отправлено'}">${m.read?'✓✓':'✓'}</span>`:''}</div>${out&&!m.file?`<div class="msg-actions"><button class="msg-action edit-message" title="Изменить" aria-label="Изменить">${ICON.edit}</button><button class="msg-action delete-message" title="Удалить" aria-label="Удалить">${ICON.trash}</button></div>`:''}</div>`}
function renderMessages(msgs){
  if(!msgs.length){messagesBox.innerHTML='<div class="empty-users" style="margin:auto">Первое сообщение задаёт тон всему диалогу.</div>';return}
  messagesBox.innerHTML=msgs.map(messageHTML).join('');messagesBox.scrollTop=messagesBox.scrollHeight;
  messagesBox.querySelectorAll('.edit-message').forEach(btn=>btn.addEventListener('click',()=>editMessage(btn.closest('.msg').dataset.id)));
  messagesBox.querySelectorAll('.delete-message').forEach(btn=>btn.addEventListener('click',()=>deleteMessage(btn.closest('.msg').dataset.id)));
}
function onIncomingMessage(msg){
  const isForMe=msg.to===me.login&&msg.from!==me.login;
  const isVisibleChat=activeUser===msg.from&&!document.hidden;
  if(isForMe&&!isVisibleChat){unreadCount++;updateDocumentTitle();if(soundEnabled)playNotificationSound()}
  if(msg.from===me.login&&msg.to===activeUser||msg.to===me.login&&msg.from===activeUser){
    if(!currentMessages.some(m=>m.id===msg.id))currentMessages.push(msg);
    renderMessages(currentMessages);if(msg.to===me.login){unreadCount=0;updateDocumentTitle();socket.emit('read',{from:msg.from})};
  }
}
function sendMessage(file=null){
  const text=msgInput.value.trim();if((!text&&!file)||!activeUser||!socket)return;
  socket.emit('message',{to:activeUser,text,file});msgInput.value='';socket.emit('typing',{to:activeUser,active:false});makeSparks($('sendBtn'));
}
$('sendBtn').addEventListener('click',()=>sendMessage());
msgInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
msgInput.addEventListener('input',()=>{
  if(!activeUser||!socket)return;socket.emit('typing',{to:activeUser,active:true});clearTimeout(typingStopTimer);
  typingStopTimer=setTimeout(()=>socket.emit('typing',{to:activeUser,active:false}),1000);
});
$('attachBtn').addEventListener('click',()=>$('fileInput').click());
$('fileInput').addEventListener('change',async e=>{
  const file=e.target.files[0];if(!file)return;if(!activeUser){toast('Сначала выбери чат');e.target.value='';return}
  const data=new FormData();data.append('file',file);$('attachBtn').style.opacity='.5';
  try{const r=await fetch('/api/upload',{method:'POST',body:data});const result=await r.json();if(!r.ok)throw Error(result.error||'Не удалось загрузить файл');sendMessage(result.file)}catch(err){toast(err.message||'Ошибка загрузки')}finally{$('attachBtn').style.opacity='1';e.target.value=''}
});
function editMessage(id){const m=currentMessages.find(x=>x.id===id);if(!m)return;const next=prompt('Изменить сообщение:',m.text);if(next===null)return;if(!next.trim()){toast('Сообщение не может быть пустым');return}socket.emit('edit-message',{id,text:next.trim()})}
function deleteMessage(id){if(confirm('Удалить это сообщение у всех участников?'))socket.emit('delete-message',{id})}
function makeSparks(target){
  const r=target.getBoundingClientRect();for(let i=0;i<7;i++){const s=document.createElement('i');s.className='spark';s.style.left=(r.width/2+(Math.random()-.5)*18)+'px';s.style.top=(r.height/2+(Math.random()-.5)*12)+'px';s.style.setProperty('--dx',((Math.random()-.5)*55)+'px');s.style.setProperty('--dy',(-12-Math.random()*35)+'px');target.appendChild(s);setTimeout(()=>s.remove(),650)}
}
// Звук уведомления создаётся синтезатором браузера, без внешних файлов.
function updateSoundButton(){const b=$('soundBtn');if(!b)return;b.classList.toggle('muted',!soundEnabled);b.textContent=soundEnabled?'♪':'♩';b.title='Звук уведомлений: '+(soundEnabled?'включён':'выключен');b.setAttribute('aria-label',b.title)}
function updateDocumentTitle(){document.title=unreadCount>0?`(${unreadCount}) YutuGram`:'YutuGram — сообщения без шума'}
function playNotificationSound(){try{const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;audioContext=audioContext||new Ctx();if(audioContext.state==='suspended')audioContext.resume();const osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type='sine';osc.frequency.setValueAtTime(880,audioContext.currentTime);osc.frequency.exponentialRampToValueAtTime(1320,audioContext.currentTime+.08);gain.gain.setValueAtTime(.0001,audioContext.currentTime);gain.gain.exponentialRampToValueAtTime(.12,audioContext.currentTime+.015);gain.gain.exponentialRampToValueAtTime(.0001,audioContext.currentTime+.16);osc.connect(gain);gain.connect(audioContext.destination);osc.start();osc.stop(audioContext.currentTime+.17)}catch(err){console.warn('Не удалось воспроизвести звук уведомления',err)}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){unreadCount=0;updateDocumentTitle()}});
function renderMyAvatar(){const el=$('myAvatar');if(!el||!me)return;el.style.background=avatarStyle(me.login);el.innerHTML=me.avatar?`<img class="avatar-image" src="${escapeHtml(me.avatar)}" alt="">`:escapeHtml(initials(me.name))}
async function uploadAvatar(e){const file=e.target.files&&e.target.files[0];if(!file)return;try{if(!file.type.startsWith('image/'))throw Error('Можно загрузить только изображение');if(file.size>5*1024*1024)throw Error('Размер изображения не должен превышать 5 МБ');const fd=new FormData();fd.append('file',file);fd.append('purpose','avatar');const r=await fetch('/api/upload',{method:'POST',body:fd});const data=await r.json();if(!r.ok)throw Error(data.error||'Не удалось загрузить аватарку');const avatar=data.file?.url||data.url;if(!avatar)throw Error('Сервер не вернул путь к изображению');const pr=await fetch('/api/profile',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:me.login,avatar})});const profile=await pr.json();if(!pr.ok)throw Error(profile.error||'Не удалось сохранить аватарку');me={...me,...(profile.user||{}),avatar};localStorage.setItem('yg_me',JSON.stringify(me));$('myTag').textContent='@'+me.login;renderMyAvatar();allUsers=allUsers.map(u=>u.login===me.login?{...u,avatar}:u);renderUsers();if(activeUser){const other=allUsers.find(u=>u.login===activeUser);if(other){$('chatHeaderAvatar').style.background=avatarStyle(other.login);$('chatHeaderAvatar').innerHTML=other.avatar?`<img class="avatar-image" src="${escapeHtml(other.avatar)}" alt="">`:escapeHtml(initials(other.name))}}toast('Аватарка обновлена')}catch(err){toast(err.message||'Ошибка загрузки аватарки')}finally{e.target.value=''}}
const EMOJI_CATEGORIES={smiles:'😀 😃 😄 😁 😆 😅 😂 🙂 🙃 😉 😊 😍 🥰 😎 🤔 😭 😴 🤗 🤩 😘',gestures:'👋 🤚 ✋ 🖖 👌 🤌 🤏 ✌️ 🤞 🫶 🤟 🤘 🤙 👍 👎 👏 🙌 🙏 💪',hearts:'❤️ 🧡 💛 💚 💙 💜 🖤 🤍 🤎 💔 ❤️‍🔥 💕 💞 💓 💗 💖 💘 💝',food:'🍏 🍎 🍌 🍉 🍇 🍓 🍒 🍑 🥑 🍕 🍔 🍟 🌮 🍣 🍜 🍩 🍪 🎂 ☕ 🧋'};
function renderEmojiGrid(){const grid=$('emojiGrid');if(!grid)return;grid.innerHTML=EMOJI_CATEGORIES[emojiCategory].split(' ').map(e=>`<button class="emoji-item" type="button" data-emoji="${e}" aria-label="${e}">${e}</button>`).join('');grid.querySelectorAll('.emoji-item').forEach(b=>b.addEventListener('click',()=>insertEmoji(b.dataset.emoji)))}
function insertEmoji(emoji){const input=msgInput;const start=Number.isInteger(input.selectionStart)?input.selectionStart:input.value.length;const end=Number.isInteger(input.selectionEnd)?input.selectionEnd:start;input.value=input.value.slice(0,start)+emoji+input.value.slice(end);const pos=start+emoji.length;input.focus();input.setSelectionRange(pos,pos);$('emojiPanel').classList.remove('open');input.dispatchEvent(new Event('input',{bubbles:true}))}
$('emojiBtn').addEventListener('click',()=>{const panel=$('emojiPanel');panel.classList.toggle('open');if(panel.classList.contains('open'))renderEmojiGrid()});
document.querySelectorAll('.emoji-tab').forEach(b=>b.addEventListener('click',()=>{emojiCategory=b.dataset.category;document.querySelectorAll('.emoji-tab').forEach(t=>t.classList.toggle('active',t===b));renderEmojiGrid()}));
document.addEventListener('pointerdown',e=>{if(!$('emojiPanel').contains(e.target)&&!$('emojiBtn').contains(e.target))$('emojiPanel').classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('emojiPanel').classList.remove('open')});
let toastTimer;function toast(text){const el=$('toast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600)}
function safeText(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function videoDate(ts){return new Date(ts).toLocaleString('ru-RU',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
async function loadVideoFeed(){try{const url=savedVideosMode?`/api/videos/saved/${encodeURIComponent(me.login)}`:`/api/videos?login=${encodeURIComponent(me.login)}&platform=${encodeURIComponent(feedPlatform)}`;const r=await fetch(url);const data=await r.json();if(!r.ok)throw Error(data.error||'Не удалось загрузить ленту');videoCache=data;renderVideoFeed()}catch(e){$('videoFeed').innerHTML=`<div class="video-empty">${safeText(e.message)}</div>`}}
function renderVideoFeed(){const root=$('videoFeed');if(!root)return;let list=videoCache.slice().sort((a,b)=>b.time-a.time);if(savedVideosMode)list=list.filter(v=>v.saved);else if(feedPlatform!=='all')list=list.filter(v=>v.platform===feedPlatform);if(!list.length){root.innerHTML='<div class="video-empty">Здесь пока пусто. Добавь первое видео! ✨</div>';return}root.innerHTML=list.map(v=>`<article class="video-card" data-video="${safeText(v.id)}"><div class="video-card-head"><div style="width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#a78bfa,#67e8f9);display:grid;place-items:center;font-size:17px">${v.platform==='YouTube'?'▶':v.platform==='TikTok'?'♪':v.platform==='VK'?'ᴠκ':v.platform==='Instagram'?'◎':v.platform==='Rutube'?'▶':'𝕏'}</div><div><strong>${safeText(v.platform)} · @${safeText(v.author)}</strong><small>${videoDate(v.time)}</small></div><span class="spacer"></span>${v.author===me.login?'<button class="video-delete" data-action="delete" title="Удалить видео">×</button>':''}</div><iframe class="video-frame ${v.ratio==='9:16'?'vertical':''}" src="${safeText(v.embedUrl)}" title="Видео ${safeText(v.platform)}" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe><div class="video-actions"><button data-action="like" class="${v.liked?'liked':''}">❤️ ${Number(v.likes)||0}</button><button data-action="comments">💬 Комментарии (${(v.comments||[]).length})</button><button data-action="share">➡️ Переслать в чат</button><button data-action="save">${v.saved?'🔖 Сохранено':'🔖 Сохранить'}</button><a href="${safeText(v.originalUrl)}" target="_blank" rel="noopener" style="color:#a5b4fc;text-decoration:none;padding:8px 5px;font-size:12px">Открыть ↗</a></div></article>`).join('');root.querySelectorAll('.video-card').forEach(card=>card.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const id=card.dataset.video,action=b.dataset.action;if(action==='like')likeVideo(id);if(action==='comments')openComments(id);if(action==='share')shareVideo(id);if(action==='save')saveVideo(id);if(action==='delete')deleteVideo(id)}))}
async function addVideo(e){e.preventDefault();const input=$('videoUrlInput'),url=input.value.trim();if(!url)return;try{const r=await fetch('/api/videos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,login:me.login})});const data=await r.json();if(!r.ok)throw Error(data.error||'Не удалось добавить видео');input.value='';savedVideosMode=false;feedPlatform='all';document.querySelectorAll('.feed-filter').forEach(b=>b.classList.toggle('active',b.dataset.platform==='all'));await loadVideoFeed();toast('Видео добавлено в ленту')}catch(e){toast(e.message)}}
async function likeVideo(id){try{const r=await fetch(`/api/videos/${encodeURIComponent(id)}/like`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:me.login})});const d=await r.json();if(!r.ok)throw Error(d.error);const v=videoCache.find(x=>x.id===id);if(v){v.likes=d.likes;v.liked=d.liked}renderVideoFeed()}catch(e){toast(e.message)}}
async function saveVideo(id){try{const r=await fetch(`/api/videos/${encodeURIComponent(id)}/save`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:me.login})});const d=await r.json();if(!r.ok)throw Error(d.error);const v=videoCache.find(x=>x.id===id);if(v)v.saved=d.saved;if(savedVideosMode)await loadVideoFeed();else renderVideoFeed();toast(d.saved?'Сохранено':'Убрано из избранного')}catch(e){toast(e.message)}}
async function deleteVideo(id){if(!confirm('Удалить это видео из общей ленты?'))return;try{const r=await fetch(`/api/videos/${encodeURIComponent(id)}?login=${encodeURIComponent(me.login)}`,{method:'DELETE'});const d=await r.json();if(!r.ok)throw Error(d.error);videoCache=videoCache.filter(v=>v.id!==id);renderVideoFeed()}catch(e){toast(e.message)}}
function openComments(id){activeVideoId=id;const v=videoCache.find(x=>x.id===id);if(!v)return;renderComments(v);$('videoModal').classList.add('open');$('commentInput').focus()}
function renderComments(v){const root=$('commentList');root.innerHTML=(v.comments||[]).map(c=>`<div class="comment-item"><strong>@${safeText(c.login)} · ${videoDate(c.time)}</strong><p>${safeText(c.text)}</p></div>`).join('')||'<div class="video-empty">Комментариев пока нет</div>'}
$('videoModalClose').addEventListener('click',()=>$('videoModal').classList.remove('open'));$('videoModal').addEventListener('click',e=>{if(e.target===$('videoModal'))$('videoModal').classList.remove('open')});
$('commentForm').addEventListener('submit',async e=>{e.preventDefault();if(!activeVideoId)return;const input=$('commentInput'),text=input.value.trim();if(!text)return;try{const r=await fetch(`/api/videos/${encodeURIComponent(activeVideoId)}/comment`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:me.login,text})});const d=await r.json();if(!r.ok)throw Error(d.error);input.value='';const v=videoCache.find(x=>x.id===activeVideoId);if(v){v.comments=v.comments||[];if(!v.comments.some(c=>c.id===d.comment.id))v.comments.push(d.comment);renderComments(v);renderVideoFeed()}}catch(e){toast(e.message)}});
async function shareVideo(id){const v=videoCache.find(x=>x.id===id);if(!v)return;if(!allUsers.length){toast('Нет собеседников для пересылки');return}const options=allUsers.map((u,i)=>`${i+1}. ${u.name} (@${u.login})`).join('\n');const answer=prompt('Кому переслать? Введи логин собеседника:\n'+options);if(!answer)return;const to=answer.trim().replace(/^@/,'').toLowerCase();if(!allUsers.some(u=>u.login===to)){toast('Не найден такой собеседник');return}socket.emit('message',{to,text:`🎬 ${v.platform}: ${v.originalUrl}`});toast('Ссылка отправлена в чат')}
$('videoAddForm').addEventListener('submit',addVideo);
$('feedTab').addEventListener('click',()=>{ $('feedTab').classList.add('active');$('chatsTab').classList.remove('active');$('userList').style.display='none';$('communityTitle').style.display='none';$('userSearch').parentElement.style.display='none';$('noChat').style.display='none';$('chatView').style.display='none';$('feedView').classList.add('active');$('chatArea').classList.remove('chat-hidden');$('sidebar').classList.remove('compact-hidden');loadVideoFeed()});
$('chatsTab').addEventListener('click',()=>{ $('chatsTab').classList.add('active');$('feedTab').classList.remove('active');$('userList').style.display='';$('communityTitle').style.display='';$('userSearch').parentElement.style.display='';$('feedView').classList.remove('active');if(activeUser){$('chatView').style.display='flex';$('noChat').style.display='none'}else{$('chatView').style.display='none';$('noChat').style.display='flex'} });
document.querySelectorAll('.feed-filter[data-platform]').forEach(b=>b.addEventListener('click',()=>{savedVideosMode=false;feedPlatform=b.dataset.platform;document.querySelectorAll('.feed-filter').forEach(t=>t.classList.toggle('active',t===b));loadVideoFeed()}));
$('savedVideosBtn').addEventListener('click',()=>{savedVideosMode=true;document.querySelectorAll('.feed-filter').forEach(t=>t.classList.remove('active'));$('savedVideosBtn').classList.add('active');loadVideoFeed()});
try{const saved=localStorage.getItem('yg_me');if(saved){me=JSON.parse(saved);if(me&&me.login&&me.name)enterApp();else localStorage.removeItem('yg_me')}}catch{localStorage.removeItem('yg_me')}
</script>
</body>
</html>
